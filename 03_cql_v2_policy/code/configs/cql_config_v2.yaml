{
  "seed": 42,
  "min_action_support": 50,
  "excluded_recommendation_zones": ["0"],
  "state_observable_features": [
    "self_x", "self_y", "opponent_x", "opponent_y", "previous_delta_time",
    "recent_self_movement", "recent_self_speed", "recent_opponent_movement", "recent_opponent_speed"
  ],
  "explicit_context_features": true,
  "self_position_boundaries_m": [2.23, 4.47],
  "context_action_mask": true,
  "min_context_action_support": 20,
  "min_context_actions": 3,
  "context_mask_fallback": ["previous_shot", "global"],
  "reward_mode": "terminal_outcome_only",
  "terminal_win_reward": 1.0,
  "terminal_loss_reward": -1.0,
  "workload_component_clip_quantile": 0.95,
  "target_mean_workload_penalty_per_rally": 0.0,
  "hidden_layers": [128, 128],
  "activation": "ReLU",
  "learning_rate": 0.0003,
  "weight_decay": 0.0001,
  "gamma": 0.99,
  "batch_size": 256,
  "action_balanced_sampling": true,
  "balanced_sampling_power": 0.5,
  "cql_alpha_candidates": [0.1, 0.25, 0.5],
  "target_soft_update_tau": 0.005,
  "gradient_clip_norm": 5.0,
  "max_epochs": 60,
  "early_stopping_patience": 12,
  "early_stopping_metric": "validation_rank_sum",
  "num_workers": 0
}
