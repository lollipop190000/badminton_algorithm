name: Smash specialist action audit

on:
  pull_request:
    branches: [main]
    paths:
      - '03_cql_v2_policy/code/scripts/audit_smash_actions.py'
      - '.github/workflows/smash-action-audit.yml'

permissions:
  contents: read

jobs:
  actions:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/03-smash-specialist-comparison'
    name: Initial-action diagnostic (${{ matrix.cost }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - cost: M0
            intervals: 80
          - cost: M3
            intervals: 100
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Compare recommendations on identical initial states without a paid pod
        env:
          MPLBACKEND: Agg
          NUMBA_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '1'
        run: python run.py exec scripts/audit_smash_actions.py --cost ${{ matrix.cost }} --intervals ${{ matrix.intervals }} --out "${{ runner.temp }}/smash-${{ matrix.cost }}"
      - uses: actions/upload-artifact@v7
        with:
          name: action-audit-${{ matrix.cost }}
          path: ${{ runner.temp }}/smash-${{ matrix.cost }}
          retention-days: 2
